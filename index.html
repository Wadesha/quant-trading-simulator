<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantSim · 量化交易驾驶舱</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 顶部固定驾驶舱 -->
  <header class="cockpit">
    <div class="cockpit-top">
      <div class="brand">
        <span class="status-dot"></span>
        <div class="brand-text">
          <div class="title">QuantSim 驾驶舱</div>
          <div class="subtitle">模拟量化交易运营 · 仅演示</div>
        </div>
      </div>
      <div class="cockpit-metrics" id="cockpitMetrics"></div>
      <div class="cockpit-actions">
        <button type="button" class="btn ghost small" id="resetBtn">重置</button>
      </div>
    </div>
    <div class="cockpit-chart">
      <span class="chart-label">资产净值走势</span>
      <div class="chart-box">
        <svg id="sparkChart"></svg>
        <div id="chartTip" class="chart-tip hidden"></div>
      </div>
    </div>
  </header>

  <main>
    <!-- 操作按钮区 -->
    <section class="panel">
      <div class="panel-head">
        <h2>操作台</h2>
        <span class="hint" id="opHint">点击任意操作按钮，上方驾驶舱数据会立即更新并高亮变化</span>
        <button type="button" class="btn ghost small" id="refreshMarket">换一批行情</button>
      </div>
      <div class="market-strip" id="marketSignals"></div>
      <div class="op-grid" id="opGrid"></div>
    </section>

    <!-- 结果横幅 -->
    <section class="panel result-panel">
      <div id="resultBox" class="result hidden"></div>
    </section>

    <!-- 操作记录 -->
    <section class="panel">
      <div class="panel-head">
        <h2>操作记录</h2>
        <button type="button" class="btn ghost small" id="clearLog">清空</button>
      </div>
      <div class="table-wrap">
        <table class="log-table">
          <thead>
            <tr>
              <th>时间</th><th>操作</th><th>平台 / 品类</th><th>策略</th><th>风控</th><th>投入</th><th>收益率</th><th>盈亏</th><th>一句话评价</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
        <div id="logEmpty" class="empty">暂无记录，请点击上方任一操作按钮。</div>
      </div>
    </section>
  </main>

  <footer class="footer">QuantSim 模拟后台 · 数据均为模拟，不构成任何投资建议。</footer>

  <script src="app.js"></script>
</body>
</html>
